<!DOCTYPE html>
<html lang="id">
<head>
    <!-- ===== Mode Full Lokal: database, gambar, dan API kasir semuanya
         jalan di HP ini (tanpa server). Wajib dimuat paling awal, sebelum
         script lain sempat memanggil fetch('/api/...'). ===== -->
    <script src="/js/vendor/sql-wasm.js"></script>
    <script src="/js/idb-helper.js"></script>
    <script src="/js/lib/base64.js"></script>
    <script src="/js/local-images.js"></script>
    <script src="/js/local-db.js"></script>
    <script src="/js/local-auth.js"></script>
    <script src="/js/fetch-shim.js"></script>
    <script type="module" src="/js/local-app.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <title>Login - muidsoft</title>
    
    <link rel="stylesheet" href="/styles.css">
    <link href="/fonts/fontawesome/css/all.min.css" rel="stylesheet">
    <link href="/fonts/google/fonts.css" rel="stylesheet">
    
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);

            /* ===== Token warna & bayangan — dipakai konsisten di semua
               elemen halaman ini. Navy lebih dalam + emas lebih kaya
               dibanding sebelumnya, dan shadow di-tint navy (bukan abu-abu
               netral) supaya terasa "menyatu" dengan palet, bukan default
               browser. ===== */
            --ink-950: #060b1a;
            --ink-900: #0a1228;
            --navy-800: #111b3a;
            --navy-700: #16244d;
            --navy-600: #1c2f61;
            --paper: #fbf9f4;
            --gold-300: #f0d99b;
            --gold-400: #d6ac42;
            --gold-500: #c2932e;
            --gold-600: #a17423;
            --shadow-sm: 0 1px 2px rgba(6,11,26,.4), 0 1px 1px rgba(6,11,26,.24);
            --shadow-md: 0 8px 24px -6px rgba(6,11,26,.35), 0 2px 6px rgba(6,11,26,.18);
            --shadow-lg: 0 24px 60px -16px rgba(6,11,26,.55), 0 8px 20px -8px rgba(6,11,26,.3);
            --shadow-gold: 0 12px 28px -8px rgba(162,116,35,.55), 0 2px 8px rgba(214,172,66,.25);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--navy-700);
            /* Gradient 3-titik + vignette halus di tepi — lebih berdimensi
               dari radial-gradient tunggal sebelumnya, dan sedikit "grain"
               dari repeating-conic-gradient super-halus supaya permukaan
               gelap tidak terlihat datar/flat seperti latar solid biasa. */
            background-image:
                radial-gradient(ellipse 900px 700px at 15% -10%, rgba(214,172,66,.16), transparent 60%),
                radial-gradient(circle at 85% 10%, #2a4380, transparent 55%),
                radial-gradient(circle at 50% 120%, var(--ink-900), var(--ink-950) 70%);
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        h1, h2 { font-family: 'Sora', 'Plus Jakarta Sans', sans-serif; }

        /* Eyebrow/label kecil bergaya "engineered" — huruf besar, tracking
           lebar, dipisah titik emas. Dipakai di beberapa tempat sebagai
           detail signature (bukan cuma label biasa). */
        .eyebrow {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: .68rem;
            letter-spacing: .18em;
            text-transform: uppercase;
        }
        .eyebrow-dot {
            display: inline-block; width: 3px; height: 3px; border-radius: 999px;
            background: var(--gold-400); margin: 0 .55em; vertical-align: middle;
        }

        .logo-badge {
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(214,172,66,.25);
            position: relative;
        }
        .logo-badge::after {
            /* Cincin tipis emas yang sedikit "berpendar" di belakang logo —
               satu-satunya aksen dekoratif yang cukup berani di halaman ini,
               selebihnya sengaja ditahan/quiet. */
            content: ''; position: absolute; inset: -10px; border-radius: inherit;
            border: 1px solid rgba(214,172,66,.35);
            box-shadow: 0 0 32px 4px rgba(214,172,66,.18);
            pointer-events: none;
        }

        .btn-gold {
            background: linear-gradient(160deg, var(--gold-300) 0%, var(--gold-400) 32%, var(--gold-600) 100%);
            box-shadow: var(--shadow-gold);
            position: relative;
            overflow: hidden;
        }
        .btn-gold::before {
            /* Highlight tipis di tepi atas — kesan permukaan logam yang
               memantulkan cahaya, bukan warna solid rata. */
            content: ''; position: absolute; inset: 0 0 auto 0; height: 45%;
            background: linear-gradient(to bottom, rgba(255,255,255,.35), transparent);
            border-radius: inherit;
        }
        .btn-gold:active { box-shadow: 0 4px 14px -4px rgba(162,116,35,.5); }

        .login-card {
            box-shadow: var(--shadow-lg);
        }
        .login-form-panel {
            background: var(--paper);
            box-shadow: 0 -20px 50px -10px rgba(6,11,26,.35);
        }

        /* Input premium: border tipis + focus glow emas yang lembut,
           bukan ring biru default. */
        .input-premium {
            background: #fff;
            border: 1.5px solid #e7e2d6;
            transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
        }
        .input-premium:focus {
            outline: none;
            border-color: var(--gold-500);
            box-shadow: 0 0 0 4px rgba(194,147,46,.14);
            background: #fff;
        }

        .card-hairline {
            border: 1px solid rgba(6,11,26,.06);
            box-shadow: var(--shadow-sm);
        }

        @media (min-width: 1024px) {
            body { overflow: auto; display: flex; align-items: center; justify-content: center; }
            .login-card {
                flex-direction: row !important;
                max-width: 860px;
                width: 100%;
                margin: 2rem;
                border-radius: 2rem !important;
                overflow: hidden;
            }
            .login-hero { flex: 1 1 45%; padding-bottom: 0 !important; justify-content: center; }
            .login-form-panel { flex: 1 1 55%; border-radius: 0 !important; }
        }
        
        @keyframes slideUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Custom Input Autofill styling (Menghilangkan background kuning bawaan browser Chrome) */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #1e293b !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-end text-slate-800">
<div class="login-card flex flex-col w-full h-full">

    <!-- Area Logo (Atas) -->
    <div class="login-hero flex-1 flex flex-col items-center justify-center pt-[var(--safe-top)] pb-10 text-white animate-fade-in z-0">
        <div class="logo-badge w-20 h-20 rounded-3xl overflow-hidden mb-7">
            <img src="/brand/muidsoft-appicon.png" alt="muidsoft" class="w-full h-full object-cover">
        </div>
        <h1 id="login-title" class="text-3xl font-extrabold tracking-tight mb-3" style="font-family:'Sora',sans-serif; letter-spacing:-.01em;">MUIDSOFT</h1>
        <p class="eyebrow text-gold-300" style="color:var(--gold-300); opacity:.9;">
            SECURE<span class="eyebrow-dot"></span>POS SYSTEM
        </p>
    </div>

    <!-- Bottom Sheet Form Login (Bawah) -->
    <div class="login-form-panel w-full rounded-t-[2.5rem] px-8 pt-10 pb-[calc(2rem+var(--safe-bottom))] relative z-10 animate-slide-up flex flex-col justify-center">
        
        <!-- ===================================================
             MODE LOGIN (ditampilkan kalau sudah ada akun di HP ini)
             =================================================== -->
        <div id="login-mode-wrap">
            <h2 class="text-2xl font-extrabold mb-1.5" style="font-family:'Sora',sans-serif; color:var(--navy-700); letter-spacing:-.01em;">Selamat Datang</h2>
            <p class="text-slate-500 text-sm font-medium mb-8">Masuk untuk memulai hari ini.</p>

            <!-- Form Notifikasi (Error) -->
            <div id="error-alert" class="hidden items-center gap-3 bg-red-50 text-red-600 p-4 rounded-2xl mb-6 text-sm font-bold border border-red-100 transition-all">
                <i class="fas fa-exclamation-circle text-lg shrink-0"></i>
                <span id="error-msg">Password salah.</span>
            </div>

            <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">

                <!-- Input Username -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-user"></i>
                        </div>
                        <input type="text" id="username" required autocomplete="username" autocapitalize="off" autofocus
                            class="input-premium block w-full pl-11 pr-4 py-4 rounded-2xl text-slate-800 font-bold outline-none placeholder-slate-400"
                            placeholder="Username">
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">Kata Sandi</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="password" required autocomplete="current-password"
                            class="input-premium block w-full pl-11 pr-12 py-4 rounded-2xl text-slate-800 font-bold outline-none placeholder-slate-400"
                            placeholder="Masukkan sandi">

                        <!-- Toggle Show/Hide Password -->
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-[var(--gold-600)] active:scale-90 transition-transform">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>

                    </div>
                </div>

                <!-- Tombol Login -->
                <button type="submit" id="btn-submit" class="btn-gold w-full text-[#16244d] font-bold text-lg py-4 rounded-2xl active:scale-95 transition-all flex items-center justify-center gap-2 mt-4 relative overflow-hidden">
                    <span id="btn-text">Mulai</span>
                    <i class="fas fa-arrow-right" id="btn-icon"></i>
                    <i class="fas fa-spinner fa-spin hidden absolute" id="btn-loader" style="display:none"></i>
                </button>
            </form>
        </div>

        <!-- ===================================================
             MODE SETUP AWAL (ditampilkan kalau HP ini belum punya akun
             sama sekali — instalasi baru). Menggantikan pola lama "akun
             admin/admin123 dibuat otomatis" — sekarang pemilik toko WAJIB
             bikin username & password sendiri sebelum aplikasi bisa dipakai,
             supaya tidak ada password bawaan yang sama di semua instalasi.
             =================================================== -->
        <div id="setup-mode-wrap" class="hidden">
            <h2 class="text-2xl font-extrabold mb-1.5" style="font-family:'Sora',sans-serif; color:var(--navy-700); letter-spacing:-.01em;">Siapkan Tokomu</h2>
            <p class="text-slate-500 text-sm font-medium mb-8">Pemakaian pertama kali di HP ini. Buat akun pemilik untuk mulai.</p>

            <div id="setup-error-alert" class="hidden items-center gap-3 bg-red-50 text-red-600 p-4 rounded-2xl mb-6 text-sm font-bold border border-red-100 transition-all">
                <i class="fas fa-exclamation-circle text-lg shrink-0"></i>
                <span id="setup-error-msg">Gagal menyimpan.</span>
            </div>

            <form id="setup-form" class="space-y-4" onsubmit="handleSetup(event)">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">Nama Toko</label>
                    <input type="text" id="setup-nama-toko" required autocomplete="off" autofocus
                        class="input-premium block w-full px-4 py-3.5 rounded-2xl text-slate-800 font-bold outline-none placeholder-slate-400"
                        placeholder="mis. Toko Sumber Rejeki">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">Nama Lengkap (Pemilik)</label>
                    <input type="text" id="setup-nama-lengkap" required autocomplete="name"
                        class="input-premium block w-full px-4 py-3.5 rounded-2xl text-slate-800 font-bold outline-none placeholder-slate-400"
                        placeholder="Nama kamu">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">Username</label>
                    <input type="text" id="setup-username" required autocomplete="username" autocapitalize="off"
                        class="input-premium block w-full px-4 py-3.5 rounded-2xl text-slate-800 font-bold outline-none placeholder-slate-400"
                        placeholder="Untuk login sehari-hari">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">Kata Sandi</label>
                    <input type="password" id="setup-password" required autocomplete="new-password" minlength="6"
                        class="input-premium block w-full px-4 py-3.5 rounded-2xl text-slate-800 font-bold outline-none placeholder-slate-400"
                        placeholder="Minimal 6 karakter">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">Ulangi Kata Sandi</label>
                    <input type="password" id="setup-password-confirm" required autocomplete="new-password" minlength="6"
                        class="input-premium block w-full px-4 py-3.5 rounded-2xl text-slate-800 font-bold outline-none placeholder-slate-400"
                        placeholder="Ketik ulang kata sandi">
                </div>

                <button type="submit" id="setup-btn-submit" class="btn-gold w-full text-[#16244d] font-bold text-lg py-4 rounded-2xl active:scale-95 transition-all flex items-center justify-center gap-2 mt-4 relative overflow-hidden">
                    <span id="setup-btn-text">Mulai Pakai Aplikasi</span>
                    <i class="fas fa-arrow-right" id="setup-btn-icon"></i>
                    <i class="fas fa-spinner fa-spin hidden absolute" id="setup-btn-loader" style="display:none"></i>
                </button>
            </form>
        </div>

        <p class="text-center text-[10px] text-slate-400 mt-8 font-medium">
            Semua data tersimpan lokal di HP ini saja.
        </p>
    </div>
</div><!-- /.login-card -->

    <script src="/js/pages/login-app.js"></script>
    <script src="/js/register-sw.js"></script>
</body>
</html>
