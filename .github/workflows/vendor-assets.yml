name: Vendor CDN Assets (self-host offline)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/vendor-fetch.mjs'

jobs:
  vendor-fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Jalankan vendor-fetch
        run: node scripts/vendor-fetch.mjs

      - name: Commit & push hasil unduhan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fonts public/js/vendor public/vendor-manifest.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan (asset sudah up to date)."
          else
            git commit -m "chore: vendor CDN assets locally (self-host, offline-ready)"
            git push
          fi
