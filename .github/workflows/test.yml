name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependency npm
        run: npm install

      - name: Cek migrations/ dan public/migrations/ tidak drift
        run: npm run check:migrations

      - name: Unit test (logika hitung pembayaran, dll)
        run: node --test tests/unit/helpers.test.mjs

      - name: Install browser Chromium (untuk e2e test)
        run: npx playwright install --with-deps chromium

      - name: E2E test (wizard setup, login, role admin/kasir)
        run: npm run test:e2e
